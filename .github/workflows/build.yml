name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Initialize submodules
      run: |
        git submodule update --init
    - name: Install gcc-arm-none-eabi-10.3
      run: |
        wget -q "https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2"
        sudo tar -xf gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2 -C /opt
        echo '/opt/gcc-arm-none-eabi-10.3-2021.10/bin' >> $GITHUB_PATH
    - name: Install packages build sbtools required
      run: |
        sudo apt-get update
        sudo apt-get install libcrypto++-dev libusb-1.0-0-dev -y
    - uses: actions/cache@v4
      id: sbtools-cache
      with:
        path: tools/sbtools
        key: ${{ runner.os }}-${{ hashFiles('tools/sbtools/*') }}
    - name: Build sbtools
      if: steps.sbtools-cache.outputs.cache-hit != 'true'
      run: |
        cd tools/sbtools
        make
        cd ../..
    - uses: actions/cache@v4
      id: sys_signer-cache
      with:
        path: |
          tools/sys_signer
          tools/sysigner
        key: ${{ runner.os }}-${{ hashFiles('tools/sys_signer/**/*') }}
    - name: Build sys signer
      if: steps.sys_signer-cache.outputs.cache-hit != 'true'
      run: |
        cd tools/sys_signer
        cmake .
        cmake --build .
        cp sysigner ../
        cd ../..
    - uses: actions/cache@v4
      id: mpy-cache
      with:
        path: Libs/src/micropython-master/ports/eoslib
        key: ${{ runner.os }}-${{ hashFiles('Libs/src/micropython-master/ports/eoslib/**/*') }}
    - name: Build micropython
      if: steps.mpy-cache.outputs.cache-hit != 'true'
      run: |
        cd Libs/src/micropython-master/ports/eoslib
        make
        cd ../../../../..
    - uses: actions/cache@v4
      id: khicas-cache
      with:
        path: |
          Libs/libcas.libcpp
          Libs/libcasgui.libcpp
        key: ${{ runner.os }}-${{ hashFiles('Libs/src/khicas/*') }}
    - name: Build KhiCAS
      if: steps.khicas-cache.outputs.cache-hit != 'true'
      run: |
        cd Libs/src/khicas/
        make clean
        make
        cd ../../..
    - name: CMake configure
      run: |
        echo "#pragma once" >  System/graphics/UI_build_stamp.h
        echo "#define BUILD_STAMP \"Release build ${{ github.run_number }}\"" >> System/graphics/UI_build_stamp.h
        mkdir build
        cmake -S . -B build
    - name: CMake build
      run: |
        cmake --build build --parallel
    - name: Collect and package build outputs
      run: |
        set -euo pipefail
        test -s build/System/ExistOS.sys
        test -s build/OSLoader/OSLoader.sb
        test -s build/System/sys_symtab.txt

        rm -rf dist
        mkdir -p dist
        cp build/System/ExistOS.sys dist/ExistOS.sys
        cp build/OSLoader/OSLoader.sb dist/OSLoader.sb
        cp build/System/sys_symtab.txt dist/sys_symtab.txt

        sha256sum dist/ExistOS.sys dist/OSLoader.sb dist/sys_symtab.txt > dist/SHA256SUMS
        tar -czf "dist/ExistOS-build-${{ github.run_number }}.tar.gz" -C dist \
          ExistOS.sys OSLoader.sb sys_symtab.txt SHA256SUMS
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ExistOS-build-${{ github.run_number }}
        if-no-files-found: error
        path: dist
    - name: Create GitHub release
      if: github.ref_name == 'main'
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag:  build-${{ github.run_number }}
        title: build ${{ github.run_number }}
        prerelease: false
        files: |
          dist/ExistOS.sys
          dist/OSLoader.sb
          dist/sys_symtab.txt
          dist/SHA256SUMS
          dist/ExistOS-build-${{ github.run_number }}.tar.gz
